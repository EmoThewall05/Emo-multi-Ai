name: emo_multi_ai
description: EmoMulti AI Studio - Multi-AI Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.8.0
  google_fonts: ^6.2.1
  simple_icons: ^16.23.0
  encrypt: ^5.0.3
  http: ^1.2.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  razorpay_flutter: ^1.3.7
  webview_flutter: ^4.10.0
  image_picker: ^1.1.2
  video_player: ^2.9.2
  record: ^6.0.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/

dependency_overrides:
  path_provider_foundation: 2.4.1
  shared_preferences_foundation: 2.5.4
  path_provider_android: 2.2.10
